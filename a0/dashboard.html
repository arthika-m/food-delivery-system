
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Student Management System</h1>
        <h2>Dashboard</h2>

        <p id="user">Loading user details...</p>

        <button onclick="logout()">Logout</button>
    </div>

    <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>

    <script>
        let auth0Client;

        async function start() {
            try {
                auth0Client = await auth0.createAuth0Client({
                    domain: "dev-wesy33w1g8gd7cy6.us.auth0.com",
                    clientId: "O7OHhgDMV8LyBvYSm1CYmItgSyQGrpMA",
                    cacheLocation: "localstorage"
                });

                const loggedIn = await auth0Client.isAuthenticated();

                if (!loggedIn) {
                    window.location.replace(
                        window.location.origin + "/"
                    );
                    return;
                }

                const user = await auth0Client.getUser();

                document.getElementById("user").innerText =
                    "Welcome, " +
                    (user.name || user.email || "Student") +
                    "!";

            } catch (error) {
                console.error("Dashboard error:", error);

                document.getElementById("user").innerText =
                    "Unable to load user details. Please log in again.";
            }
        }

        async function logout() {
            try {
                await auth0Client.logout({
                    logoutParams: {
                        returnTo: window.location.origin + "/"
                    }
                });
            } catch (error) {
                console.error("Logout error:", error);
            }
        }

        start();
    </script>
</body>
</html>
