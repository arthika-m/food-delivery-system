<!DOCTYPE html>
<html>
<head>
    <title>Management System</title>
</head>
<body>
    <h2>Welcome Management System</h2>
    <div id="loginSection">
        <h3>Register / Login</h3>
        <input type="email" id="email" placeholder="Enter Email">
        <input type="password" id="password" placeholder="Enter Password">
        <button id="registerBtn">Register</button>
        <button id="loginBtn">Login</button>
    </div>
    <div id="studentSection" hidden>
        <p id="welcome"></p>
        <button id="logoutBtn">Logout</button>
        <h3>Details</h3>
        <input type="hidden" id="recordId">
        <input type="text" id="name" placeholder="Student Name">
        <input type="text" id="department" placeholder="Department">
        <input type="text" id="year" placeholder="Year">
        <button id="saveBtn">Add</button>
        <button id="clearBtn">Clear</button>
        <h3>Student Records</h3>
        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>S.No</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Year</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>
    <p id="message"></p>
    <script type="module">
        import { auth, db } from "./firebase.js";
        import {
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

        import {
            collection, addDoc, getDocs, query, where,
            doc, updateDoc, deleteDoc
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const loginSection = document.getElementById("loginSection");
        const studentSection = document.getElementById("studentSection");
        const welcome = document.getElementById("welcome");
        const name = document.getElementById("name");
        const department = document.getElementById("department");
        const year = document.getElementById("year");
        const recordId = document.getElementById("recordId");
        const message = document.getElementById("message");
        const studentTable = document.getElementById("studentTable");
        const saveBtn = document.getElementById("saveBtn");
        document.getElementById("registerBtn").onclick = async () => {
            try {
                await createUserWithEmailAndPassword(
                    auth, email.value, password.value
                );
                message.textContent = "Registration successful!";
            } catch (error) {
                message.textContent = error.message;
            }
        };
        document.getElementById("loginBtn").onclick = async () => {
            try {
                await signInWithEmailAndPassword(
                    auth, email.value, password.value
                );
                message.textContent = "Login successful!";
            } catch (error) {
                message.textContent = error.message;
            }
        };
        onAuthStateChanged(auth, async (user) => {
            loginSection.hidden = !!user;
            studentSection.hidden = !user;
            if (user) {
                welcome.textContent = "Logged in: " + user.email;
                await loadStudents();
            } else {
                studentTable.innerHTML = "";
            }
        });
        document.getElementById("logoutBtn").onclick =
            () => signOut(auth);
        saveBtn.onclick = async () => {
            const studentName = name.value.trim();
            const studentDepartment = department.value.trim();
            const studentYear = year.value.trim();
            const id = recordId.value;
            if (!studentName || !studentDepartment || !studentYear) {
                message.textContent = "Please fill all three fields.";
                return;
            }
            const data = {
                name: studentName,
                department: studentDepartment,
                year: studentYear
            };
            try {
                if (id) {
                    await updateDoc(doc(db, "students", id), data);
                    message.textContent = "Student updated successfully!";
                } else {
                    await addDoc(collection(db, "students"), {
                        ...data,
                        userId: auth.currentUser.uid
                    });
                    message.textContent = "Student added successfully!";
                }
                clearForm();
                await loadStudents();
            } catch (error) {
                message.textContent = error.message;
            }
        };
        async function loadStudents() {
            try {
                const q = query(
                    collection(db, "students"),
                    where("userId", "==", auth.currentUser.uid)
                );
                const snapshot = await getDocs(q);
                studentTable.innerHTML = "";
                snapshot.forEach((item, index) => {
                    const student = item.data();
                    const row = studentTable.insertRow();
                    row.insertCell().textContent = index + 1;
                    row.insertCell().textContent = student.name;
                    row.insertCell().textContent = student.department;
                    row.insertCell().textContent = student.year;
                    const actions = row.insertCell();
                    const editBtn = document.createElement("button");
                    editBtn.textContent = "Edit";
                    editBtn.onclick = () => editStudent(item.id, student);
                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "Delete";
                    deleteBtn.onclick = () => deleteStudent(item.id);

                    actions.append(editBtn, deleteBtn);
                });
            } catch (error) {
                message.textContent = error.message;
            }
        }
        function editStudent(id, student) {
            recordId.value = id;
            name.value = student.name;
            department.value = student.department;
            year.value = student.year;

            saveBtn.textContent = "Update Student";
            message.textContent = "Edit the details and click Update Student.";
        }
        async function deleteStudent(id) {
            if (!confirm("Are you sure you want to delete this student?")) {
                return;
            }
            try {
                await deleteDoc(doc(db, "students", id));
                message.textContent = "Student deleted successfully!";
                await loadStudents();
            } catch (error) {
                message.textContent = error.message;
            }
        }
        function clearForm() {
            recordId.value = "";
            name.value = "";
            department.value = "";
            year.value = "";
            saveBtn.textContent = "Add Student";
        }
        document.getElementById("clearBtn").onclick = clearForm;
    </script>
</body>
</html>
